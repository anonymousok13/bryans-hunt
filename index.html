<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunting at Bryan's</title>
<style>
  :root {
    --bg: #0d1207;
    --bg2: #141a0a;
    --bg3: #1c2410;
    --border: #2a3518;
    --green: #7ab648;
    --green-dim: #4a7a20;
    --amber: #c8922a;
    --red: #c84a2a;
    --text: #d4cdb8;
    --text-dim: #7a7560;
    --text-bright: #eee8d0;
    --hunt: #7ab648;
    --marginal: #c8922a;
    --skip: #c84a2a;
    --pressure-drop: #e05a20;
    --pressure-rise: #7ab648;
    --pressure-steady: #7a7560;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #1c2410;
      --bg2: #232e14;
      --bg3: #2a3a18;
      --border: #3a4a28;
      --text: #d4cdb8;
      --text-dim: #8a8570;
      --text-bright: #eee8d0;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Georgia', serif; }
  body { padding: 0 0 40px 0; }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: normal;
    color: var(--green);
    letter-spacing: 0.04em;
    font-family: 'Georgia', serif;
  }
  header p {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: monospace;
  }

  .week-strip {
    display: flex;
    overflow-x: auto;
    padding: 10px 12px;
    gap: 8px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .week-strip::-webkit-scrollbar { display: none; }

  .day-tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg3);
    cursor: pointer;
    text-align: center;
    min-width: 62px;
    transition: border-color 0.15s;
  }
  .day-tab.active { border-color: var(--green); }
  .day-tab .dow { font-size: 0.68rem; color: var(--text-dim); font-family: monospace; text-transform: uppercase; letter-spacing: 0.06em; }
  .day-tab .date-num { font-size: 1.1rem; color: var(--text-bright); margin: 2px 0; }
  .day-tab .tab-score {
    font-size: 0.7rem;
    font-family: monospace;
    font-weight: bold;
  }
  .tab-score.hunt { color: var(--hunt); }
  .tab-score.marginal { color: var(--marginal); }
  .tab-score.skip { color: var(--skip); }

  .main { padding: 14px 12px; max-width: 600px; margin: 0 auto; }

  .session-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .session-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .session-label {
    font-size: 0.72rem;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .verdict {
    font-size: 0.8rem;
    font-weight: bold;
    font-family: monospace;
    letter-spacing: 0.05em;
  }
  .verdict.hunt { color: var(--hunt); }
  .verdict.marginal { color: var(--marginal); }
  .verdict.skip { color: var(--skip); }

  .score-bar-wrap { padding: 10px 14px 0; }
  .score-bar-bg {
    background: var(--bg3);
    border-radius: 3px;
    height: 6px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .score-bar-fill.hunt { background: var(--hunt); }
  .score-bar-fill.marginal { background: var(--marginal); }
  .score-bar-fill.skip { background: var(--skip); }
  .score-pct { font-size: 0.68rem; color: var(--text-dim); font-family: monospace; margin-top: 4px; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    margin: 10px 0 0;
    border-top: 1px solid var(--border);
  }
  .metric {
    background: var(--bg2);
    padding: 8px 10px;
    text-align: center;
  }
  .metric-val {
    font-size: 1rem;
    color: var(--text-bright);
    font-family: monospace;
  }
  .metric-lbl {
    font-size: 0.62rem;
    color: var(--text-dim);
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .metric-val.good { color: var(--green); }
  .metric-val.warn { color: var(--amber); }
  .metric-val.bad { color: var(--red); }

  .pressure-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    font-family: monospace;
  }
  .pressure-arrow { font-size: 1rem; }
  .pressure-arrow.dropping { color: var(--pressure-drop); }
  .pressure-arrow.rising { color: var(--pressure-rise); }
  .pressure-arrow.steady { color: var(--pressure-steady); }
  .pressure-label.dropping { color: var(--pressure-drop); font-weight: bold; }
  .pressure-label.rising { color: var(--pressure-rise); }
  .pressure-label.steady { color: var(--pressure-steady); }

  .solunar-row {
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    font-family: monospace;
    color: var(--text-dim);
  }
  .solunar-row span { color: var(--amber); }

  .summary-box {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--text);
    font-style: italic;
  }

  .todo-box {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg3);
  }
  .todo-label {
    font-size: 0.65rem;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green-dim);
    margin-bottom: 6px;
  }
  .todo-item {
    font-size: 0.78rem;
    color: var(--text);
    padding: 3px 0;
    padding-left: 12px;
    position: relative;
  }
  .todo-item::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--green-dim);
  }

  .rut-banner {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rut-phase-name {
    font-size: 0.9rem;
    color: var(--amber);
    font-family: 'Georgia', serif;
  }
  .rut-phase-sub {
    font-size: 0.68rem;
    color: var(--text-dim);
    font-family: monospace;
    margin-top: 2px;
  }
  .rut-next {
    font-size: 0.68rem;
    color: var(--text-dim);
    font-family: monospace;
    text-align: right;
  }

  .pressure-alert {
    background: rgba(224,90,32,0.12);
    border: 1px solid rgba(224,90,32,0.4);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--pressure-drop);
    font-family: monospace;
  }

  .log-section {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .log-title {
    font-size: 0.72rem;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .log-form {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .log-form select, .log-form input, .log-form button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: monospace;
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 4px;
  }
  .log-form button {
    background: var(--green-dim);
    color: var(--text-bright);
    cursor: pointer;
    border-color: var(--green-dim);
  }
  .log-form button:active { opacity: 0.8; }
  .log-entry {
    font-size: 0.72rem;
    font-family: monospace;
    color: var(--text-dim);
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .log-entry span { color: var(--text); }

  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-family: monospace;
    font-size: 0.8rem;
  }
  .error-msg {
    background: rgba(200,74,42,0.1);
    border: 1px solid rgba(200,74,42,0.3);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--red);
    font-family: monospace;
    margin-bottom: 12px;
  }

  .moon-row {
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    font-family: monospace;
    color: var(--text-dim);
    display: flex;
    gap: 14px;
  }
  .moon-row span { color: var(--text); }

  .days-since {
    font-size: 0.68rem;
    font-family: monospace;
    color: var(--text-dim);
    text-align: right;
    padding: 4px 14px 8px;
  }
  .tab-alert {
    font-size: 0.75rem;
    margin-top: 2px;
  }
  .tab-alert.hot {
    animation: pulse-alert 1.2s ease-in-out infinite;
  }
  @keyframes pulse-alert {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }
  .day-tab.has-alert {
    border-color: var(--amber);
  }
  .day-tab.has-alert.active {
    border-color: var(--green);
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .tab-nav-btn {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-family: monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-nav-btn.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  /* Season calendar */
  .cal-view { padding: 14px 12px; max-width: 600px; margin: 0 auto; }
  .cal-event {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .cal-event.today {
    border-color: var(--green);
    animation: pulse-green 1.5s ease-in-out 3;
  }
  @keyframes pulse-green {
    0%,100% { box-shadow: 0 0 0 0 rgba(122,182,72,0); }
    50% { box-shadow: 0 0 0 6px rgba(122,182,72,0.3); }
  }
  .cal-event-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .cal-icon { font-size: 1.1rem; }
  .cal-date {
    font-family: monospace;
    font-size: 0.78rem;
    color: var(--amber);
    font-weight: bold;
    min-width: 70px;
  }
  .cal-date.today-label { color: var(--green); }
  .cal-title {
    font-size: 0.85rem;
    color: var(--text-bright);
    font-family: 'Georgia', serif;
  }
  .cal-today-badge {
    margin-left: auto;
    background: var(--green);
    color: var(--bg);
    font-family: monospace;
    font-size: 0.62rem;
    font-weight: bold;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
    animation: badge-pop 0.4s ease;
  }
  @keyframes badge-pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .cal-punches {
    padding: 8px 14px 10px;
  }
  .cal-punch {
    font-size: 0.78rem;
    color: var(--text);
    padding: 3px 0;
    padding-left: 14px;
    position: relative;
    line-height: 1.4;
  }
  .cal-punch::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--green-dim);
  }
  .cal-season-tag {
    font-size: 0.65rem;
    font-family: monospace;
    color: var(--text-dim);
    padding: 0 14px 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Hunting at Bryan's</h1>
  <p id="coords-label">36.678800, -96.078444 · Loading...</p>
</header>

<div class="tab-nav">
  <button class="tab-nav-btn active" onclick="switchTab('forecast')">7-Day Forecast</button>
  <button class="tab-nav-btn" onclick="switchTab('calendar')">Season Calendar</button>
</div>

<div id="forecast-tab">
  <div class="week-strip" id="week-strip">
    <div class="loading">Loading forecast...</div>
  </div>
  <div class="main" id="main-content">
    <div class="loading">Pulling weather data...</div>
  </div>
</div>

<div id="calendar-tab" style="display:none">
  <div class="cal-view" id="cal-content"></div>
</div>

<script>
const LAT = 36.678800;
const LON = -96.078444;
const STAND_LABEL = "Bryan's Lease — Osage County";

// Tab switching
function switchTab(tab) {
  document.getElementById('forecast-tab').style.display = tab === 'forecast' ? 'block' : 'none';
  document.getElementById('calendar-tab').style.display = tab === 'calendar' ? 'block' : 'none';
  document.querySelectorAll('.tab-nav-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'forecast') || (i === 1 && tab === 'calendar'));
  });
  if (tab === 'calendar') renderCalendar();
}

// Season calendar events
const SEASON_EVENTS = [
  // Oklahoma seasons
  { month: 10, day: 1,  icon: '🏹', title: 'Archery Season Opens',        tag: 'Oklahoma Bow Season',     punches: ['Season is on — get in the stand', 'Check license and tags', 'Sight in your bow at hunting distances'] },
  { month: 10, day: 16, icon: '🔫', title: 'Youth Gun Season Opens',       tag: 'Oct 16-18 only',          punches: ['Youth hunters only', 'Great time to bring Mason', 'Firearms legal this weekend'] },
  { month: 10, day: 19, icon: '🏹', title: 'Youth Gun Season Closes',      tag: 'Back to archery only',    punches: ['Rifle put away — bow back in hand', 'Pattern any deer pushed by gun pressure'] },
  { month: 10, day: 21, icon: '🦌', title: 'Pre-Rut Begins',              tag: 'Rut Phase',               punches: ['Start looking for scrapes', 'Put out the mock scrape dripper', 'Build a fake rub on a fresh sapling near a scrape', 'Hang estrus wick 20 yards upwind of your stand', 'Start calling — light buck tickling, not fighting', 'Check cameras on scrape lines', 'Hunt mornings hard'] },
  { month: 10, day: 24, icon: '🔫', title: 'Muzzleloader Season Opens',    tag: 'Oct 24 - Nov 1',          punches: ['Muzzleloader legal alongside archery', 'Expect some pressure — deer may shift patterns', 'Hunt evenings away from pressure areas'] },
  { month: 11, day: 1,  icon: '🦌', title: 'Seeking Phase Begins',         tag: 'Rut Phase — First Peak',  punches: ['Hunt all day — bucks don\'t punch a clock', 'Mock scrape dripper running', 'Use a doe bleat or soft grunt', 'Set up on pinch points between bedding and food', 'Light rattling — single buck looking for trouble', 'Check scrapes daily, they\'ll be torn up'] },
  { month: 11, day: 1,  icon: '🏹', title: 'Muzzleloader Season Closes',   tag: 'Archery only again',      punches: ['Back to bow only', 'Seeking phase is on — best bow hunting of early November'] },
  { month: 11, day: 9,  icon: '🦌', title: 'Lockdown / Peak Rut',          tag: 'Rut Phase — Main Peak',   punches: ['Hunt funnels all day', 'Aggressive rattling and blind calling', 'Don\'t burn your best stand — save it for an 80+ day', 'Doe groups will drag bucks anywhere', 'Stay flexible — bucks can appear anywhere'] },
  { month: 11, day: 19, icon: '🦌', title: 'Post-Rut',                     tag: 'Rut Phase',               punches: ['Pull the dripper', 'Hunt food sources only', 'Bucks recovering — mornings hard, evenings soft', 'Doe groups tell you where bucks are staging'] },
  { month: 11, day: 21, icon: '🔫', title: 'Gun Season Opens',             tag: 'Nov 21 - Dec 6',          punches: ['Rifle season is on', 'Expect heavy pressure opening weekend', 'Deer will shift — hunt edges and deep timber', 'Post-rut bucks chasing hard — still huntable'] },
  { month: 12, day: 6,  icon: '🏹', title: 'Gun Season Closes',            tag: 'Back to archery only',    punches: ['Rifle pressure gone — deer settling back down', 'Late season patterns emerging', 'Hunt food sources hard'] },
  { month: 12, day: 10, icon: '🦌', title: 'Second Rut',                   tag: 'Rut Phase — Secondary',   punches: ['Estrus wick back out', 'Mock scrape dripper back in service', 'Hunt like it\'s the seeking phase', 'Call and rattle again', 'Yearling does cycling — bucks will cruise'] },
  { month: 1,  day: 15, icon: '🏹', title: 'Archery Season Closes',        tag: '2026-27 Season End',      punches: ['Last day of archery', 'Make it count', 'Clean and store your gear properly'] },
];

function renderCalendar() {
  const cal = document.getElementById('cal-content');
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();

  // Filter out past events (keep today)
  const upcoming = SEASON_EVENTS.filter(e => {
    // Handle Jan events as next year
    const year = e.month < 9 ? 2027 : 2026;
    const eDate = new Date(year, e.month - 1, e.day);
    eDate.setHours(0,0,0,0);
    return eDate >= today;
  });

  if (upcoming.length === 0) {
    cal.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);font-family:monospace">Season\'s over. See you next October.</div>';
    return;
  }

  const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let html = '';
  upcoming.forEach(e => {
    const isToday = e.month === todayM && e.day === todayD;
    html += `
      <div class="cal-event ${isToday ? 'today' : ''}">
        <div class="cal-event-header">
          <span class="cal-icon">${e.icon}</span>
          <span class="cal-date ${isToday ? 'today-label' : ''}">${monthNames[e.month]} ${e.day}</span>
          <span class="cal-title">${e.title}</span>
          ${isToday ? '<span class="cal-today-badge">TODAY</span>' : ''}
        </div>
        <div class="cal-season-tag">${e.tag}</div>
        <div class="cal-punches">
          ${e.punches.map(p => `<div class="cal-punch">${p}</div>`).join('')}
        </div>
      </div>
    `;
  });

  cal.innerHTML = html;
}

// Rut phase calendar for Washington/Osage County OK
// Based on historical county activity curve
const RUT_PHASES = [
  { start: [9,1],  end: [10,20], name: "Early Season",   sub: "Food-focused, predictable movement",         next: "Pre-Rut starts Oct 21" },
  { start: [10,21],end: [10,31], name: "Pre-Rut",        sub: "Scrapes lighting up, bucks starting to cruise", next: "Seeking phase Nov 1" },
  { start: [11,1], end: [11,8],  name: "Seeking Phase",  sub: "Bucks on their feet in daylight — first peak", next: "Chasing starts Nov 9" },
  { start: [11,9], end: [11,18], name: "Lockdown / Peak",sub: "Main rut peak — bucks locked to does",       next: "Post-rut Nov 19" },
  { start: [11,19],end: [12,9],  name: "Post-Rut",       sub: "Bucks exhausted, back to food sources",      next: "Second rut Dec 10" },
  { start: [12,10],end: [12,25], name: "Second Rut",     sub: "Yearling does cycling — secondary bump",     next: "Season winds down" },
  { start: [12,26],end: [12,31], name: "Late Season",    sub: "Survival mode — food and warmth",            next: "" },
];

// Rut activity multiplier by day-of-year (normalized 0-1 from the curve)
function getRutPhase(date) {
  const m = date.getMonth() + 1;
  const d = date.getDate();
  for (const p of RUT_PHASES) {
    const [sm, sd] = p.start;
    const [em, ed] = p.end;
    const startN = sm * 100 + sd;
    const endN = em * 100 + ed;
    const curN = m * 100 + d;
    if (curN >= startN && curN <= endN) return p;
  }
  return RUT_PHASES[0];
}

function getRutMultiplier(date) {
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const n = m * 100 + d;
  // Peaks: seeking ~1105, lockdown ~1115, secondary ~1215
  if (n >= 1101 && n <= 1108) return 0.85 + (n - 1101) * 0.02;
  if (n >= 1109 && n <= 1118) return 0.95;
  if (n >= 1119 && n <= 1125) return 0.7;
  if (n >= 1210 && n <= 1220) return 0.65;
  if (n >= 1021 && n <= 1031) return 0.5 + (n - 1021) * 0.03;
  if (n >= 901  && n <= 1020) return 0.2;
  return 0.1;
}

// Solunar calculation
function getMoonPhase(date) {
  const known = new Date(2000, 0, 6);
  const diff = (date - known) / (1000 * 60 * 60 * 24);
  const cycle = 29.53058867;
  const phase = ((diff % cycle) + cycle) % cycle;
  return phase;
}

function getMoonPhaseName(phase) {
  // Daylight hunting: dark moon = deer hungry at first light = good
  // Full moon = deer fed all night = bad for morning sits
  if (phase < 1.85) return { name: "New Moon",        mult: 1.0, emoji: "🌑", note: "dark nights — deer hungry at first light" };
  if (phase < 7.38) return { name: "Waxing Crescent", mult: 0.85, emoji: "🌒", note: "low light — good morning movement" };
  if (phase < 9.22) return { name: "First Quarter",   mult: 0.75, emoji: "🌓", note: "moderate night feeding" };
  if (phase < 14.77) return { name: "Waxing Gibbous", mult: 0.60, emoji: "🌔", note: "bright nights — deer may feed late" };
  if (phase < 16.61) return { name: "Full Moon",       mult: 0.45, emoji: "🌕", note: "deer fed all night — slow mornings" };
  if (phase < 22.15) return { name: "Waning Gibbous", mult: 0.60, emoji: "🌖", note: "still bright — afternoon better than morning" };
  if (phase < 23.99) return { name: "Last Quarter",   mult: 0.75, emoji: "🌗", note: "getting darker — morning movement improving" };
  if (phase < 27.68) return { name: "Waning Crescent",mult: 0.88, emoji: "🌘", note: "dark nights — good morning activity" };
  return { name: "New Moon", mult: 1.0, emoji: "🌑", note: "dark nights — deer hungry at first light" };
}

function getSolunarPeriods(date, lat, lon) {
  // Simplified solunar — moon transit times
  const phase = getMoonPhase(date);
  const moonInfo = getMoonPhaseName(phase);
  // Moon overhead ~every 24h50m, underfoot 12h25m later
  // Rough major period times based on phase offset
  const baseHour = (phase / 29.53) * 24;
  const major1 = ((baseHour + 6) % 24);
  const major2 = ((major1 + 12.42) % 24);
  const minor1 = ((major1 + 6.21) % 24);
  const minor2 = ((major2 + 6.21) % 24);

  const fmt = h => {
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    const ampm = hh >= 12 ? 'pm' : 'am';
    return `${hh > 12 ? hh - 12 : hh || 12}:${mm.toString().padStart(2,'0')}${ampm}`;
  };

  return { major1, major2, minor1, minor2, moonInfo, fmt };
}

// Wind direction helpers
function windDirName(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function isMoneyWind(deg) {
  // NNE, NE, N, NW winds are good for the south ladder stand
  const dir = windDirName(deg);
  return ['N','NNE','NE','NNW','WNW'].includes(dir);
}

function isWarmHumidWind(deg) {
  const dir = windDirName(deg);
  return ['S','SSW','SW','SSE','SE'].includes(dir);
}

function windScore(speedMph, deg) {
  let score = 0;
  // Speed scoring
  if (speedMph >= 4 && speedMph <= 10) score = 100;
  else if (speedMph < 4) score = 60; // dead calm — scent pools
  else if (speedMph <= 15) score = 75;
  else if (speedMph <= 20) score = 40;
  else if (speedMph <= 25) score = 15;
  else score = 0;
  // Direction bonus/penalty
  if (isMoneyWind(deg)) score = Math.min(100, score + 15);
  else if (isWarmHumidWind(deg)) score = Math.max(0, score - 20);
  return score;
}

function pressureTrend(pressures) {
  // pressures: array of last 3h values in hPa
  if (!pressures || pressures.length < 2) return { trend: 'steady', delta: 0 };
  const delta = pressures[pressures.length - 1] - pressures[0];
  const deltaInHg = delta * 0.02953;
  if (deltaInHg < -0.08) return { trend: 'dropping', delta: deltaInHg };
  if (deltaInHg > 0.06) return { trend: 'rising', delta: deltaInHg };
  return { trend: 'steady', delta: deltaInHg };
}

function tempScore(tempF, windDeg, humidity) {
  // Adjust effective temp for humid south wind
  let effective = tempF;
  if (isWarmHumidWind(windDeg) && humidity > 65) effective += 5;
  if (effective < 35) return 50; // too cold for good movement
  if (effective >= 35 && effective <= 55) return 100;
  if (effective <= 65) return 80;
  if (effective <= 72) return 60;
  if (effective <= 78) return 35;
  return 10;
}

function precipScore(precip) {
  // precip in mm
  if (precip < 0.1) return 100;
  if (precip < 1) return 70; // light precip — not bad
  if (precip < 3) return 40;
  return 0;
}

function pressureScore(pTrend) {
  // Barometric pressure is the #1 short-term movement predictor
  // Dropping fast = deer moving hard ahead of front = best score
  // Rising after front = good but not as electric
  // Steady = neutral
  if (pTrend.trend === 'dropping') {
    // Scale by rate of drop
    const absDelta = Math.abs(pTrend.delta);
    if (absDelta >= 0.15) return 100; // fast drop — exceptional
    if (absDelta >= 0.10) return 90;
    return 75;
  }
  if (pTrend.trend === 'rising') {
    const absDelta = Math.abs(pTrend.delta);
    if (absDelta >= 0.10) return 70;
    return 60;
  }
  return 50; // steady — neutral
}

function computeScore(weather, solunar, date, isAM, dayIdx) {
  const { tempF, windSpeedMph, windDeg, humidity, precip, pressures } = weather;
  const pTrend = pressureTrend(pressures);
  const moonMult = solunar.moonInfo.mult;
  const rutMult = getRutMultiplier(date);
  const dIdx = dayIdx || 0;

  // Check major/minor solunar overlap with AM/PM
  const majors = [solunar.major1, solunar.major2].filter(h => isAM ? h < 12 : h >= 12);
  const minors = [solunar.minor1, solunar.minor2].filter(h => isAM ? h < 12 : h >= 12);
  const solunarScore = majors.length > 0 ? 90 : minors.length > 0 ? 65 : 40;

  const wScore = windScore(windSpeedMph, windDeg);
  const tScore = tempScore(tempF, windDeg, humidity);
  const pScore = precipScore(precip);
  const bScore = pressureScore(pTrend); // barometric

  // Disqualifiers — always apply regardless of day distance
  if (windSpeedMph > 22) return { score: 15, disqualified: 'wind', pTrend, majors, minors };
  if (precip > 0.5) return { score: 10, disqualified: 'rain', pTrend, majors, minors };

  // Distance-based weight scaling
  // Close in (0-2): weather dominates, solunar/moon light
  // Far out (5-6): solunar/moon/rut carry more since weather data is unreliable
  let wWeather, wSolunar, wMoon, wRut, wPressure, wPrecip, wTemp, wWind;

  if (dIdx <= 1) {
    // Tomorrow or today — razor sharp on real conditions
    wPressure = 0.28;
    wTemp     = 0.20;
    wWind     = 0.18;
    wPrecip   = 0.08;
    wSolunar  = 0.12;
    wMoon     = 0.08;
    wRut      = 0.06;
  } else if (dIdx <= 3) {
    // 2-3 days — still mostly weather
    wPressure = 0.22;
    wTemp     = 0.18;
    wWind     = 0.15;
    wPrecip   = 0.07;
    wSolunar  = 0.18;
    wMoon     = 0.10;
    wRut      = 0.10;
  } else {
    // 4-6 days — solunar and rut fill the gap
    wPressure = 0.12;
    wTemp     = 0.13;
    wWind     = 0.10;
    wPrecip   = 0.05;
    wSolunar  = 0.25;
    wMoon     = 0.18;
    wRut      = 0.17;
  }

  const raw =
    bScore       * wPressure +
    tScore       * wTemp     +
    wScore       * wWind     +
    pScore       * wPrecip   +
    solunarScore * wSolunar  +
    moonMult * 100 * wMoon   +
    rutMult  * 100 * wRut;

  return { score: Math.min(100, Math.round(raw)), disqualified: null, pTrend, majors, minors };
}

function scoreClass(score) {
  if (score >= 72) return 'hunt';
  if (score >= 48) return 'marginal';
  return 'skip';
}

function scoreVerdict(score, isAM) {
  const session = isAM ? 'morning' : 'afternoon';
  if (score >= 85) return `Boys, hunt the ${session}`;
  if (score >= 72) return `Hunt the ${session}`;
  if (score >= 55) return `Marginal ${session} — your call`;
  if (score >= 40) return `Probably skip the ${session}`;
  return `Stay home — skip the ${session}`;
}

function getForecastConfidence(dayIdx) {
  if (dayIdx <= 1) return { hedge: '', closing: '' };
  if (dayIdx <= 3) return { hedge: 'Looking a couple days out — ', closing: ' Keep an eye on it as it gets closer.' };
  if (dayIdx <= 5) return { hedge: 'Four to five days out, so take this with some salt — ', closing: ' Check back in a day or two when the forecast firms up.' };
  return { hedge: 'This far out it\'s more a heads-up than a verdict — ', closing: ' Way too early to set your alarm, but circle it.' };
}

function buildSummary(amWeather, pmWeather, date, amResult, pmResult, solunar, dayIdx) {
  const phase = getRutPhase(date);
  const pTrend = amResult.pTrend;
  const windDir = windDirName(amWeather.windDeg);
  const isMoneyAM = isMoneyWind(amWeather.windDeg);
  const pmDir = windDirName(pmWeather.windDeg);
  const tempStr = `${Math.round(amWeather.tempF)}°`;
  const windStr = `${Math.round(amWeather.windSpeedMph)} mph ${windDir}`;
  const pmTempStr = `${Math.round(pmWeather.tempF)}°`;
  const pmWindStr = `${Math.round(pmWeather.windSpeedMph)} mph ${pmDir}`;

  let amSummary = '';
  let pmSummary = '';
  const confidence = getForecastConfidence(dayIdx || 0);

  // Opening callout for big pressure drop
  const pressureCallout = pTrend.trend === 'dropping'
    ? ` Barometer's falling boys — deer are gonna be on their feet ahead of this front. Don't miss this window.`
    : pTrend.trend === 'rising'
    ? ` Pressure's coming back up after the front — deer are shaking off the bedding.`
    : '';

  // AM summary
  if (amResult.disqualified === 'wind') {
    amSummary = `Wind's running ${Math.round(amWeather.windSpeedMph)} mph tomorrow morning — too much. Scent's gonna be all over the place and deer won't be moving anyway. Stay home.`;
  } else if (amResult.disqualified === 'rain') {
    amSummary = `Heavy rain in the morning. Not worth burning a sit.`;
  } else {
    const majorStr = amResult.majors && amResult.majors.length > 0
      ? ` Major solunar hits at ${solunar.fmt(amResult.majors[0])}.` : '';

    const stalkNote = isGoodStalkDay ? ` Wind's steady ${amWindDir} at ${Math.round(amWeather.windSpeedMph)} mph — that ledge between the south stand and the creek bottom is set up for a stalk. Bryan might want to leave the saddle at home and work that edge.` : '';

    if (amResult.score >= 85) {
      amSummary = `${confidence.hedge}Hey fellas — morning looks like money. ${tempStr} at first light, ${windStr}${isMoneyAM ? ', wind\'s in your favor for the south stand' : ''}.${majorStr} ${phase.name === 'Seeking Phase' || phase.name === 'Lockdown / Peak' ? 'Bucks are gonna be cruising — get in there before light and don\'t come out until 10.' : 'Get in the stand before first light and sit tight.'}${pressureCallout}${stalkNote}${confidence.closing}`;
    } else if (amResult.score >= 72) {
      amSummary = `${confidence.hedge}Morning looks good boys. ${tempStr}, ${windStr}${isMoneyAM ? ' — wind\'s right for the south stand' : ''}.${majorStr} Worth setting the alarm.${pressureCallout}${stalkNote}${confidence.closing}`;
    } else if (amResult.score >= 48) {
      amSummary = `${confidence.hedge}Morning's marginal — ${tempStr}, ${windStr}. Conditions aren't great but deer could still move.${majorStr} Sit if you've got nothing going on, but don't lose sleep over it.${stalkNote}${pressureCallout}${confidence.closing}`;
    } else {
      amSummary = `${confidence.hedge}Slow morning. ${tempStr}, ${windStr}. ${isWarmHumidWind(amWeather.windDeg) ? 'That south wind\'s pulling humidity up — ' : ''}Not expecting much. Rest the stand.${pressureCallout}${confidence.closing}`;
    }
  }

  // Gun season pushed-buck note
  const isGunSeason = (() => { const n = (date.getMonth()+1)*100+date.getDate(); return n >= 1121 && n <= 1206; })();
  const gunSeasonNote = isGunSeason ? ' Gun season is open — you might see a stranger buck pushed through from neighboring ground. Watch the creek bottom and timber edges.' : '';

  // Stalk condition check — Bryan's ledge between S stand and creek bottom
  // Good stalk day: steady NNE/N/NW wind 8-15 mph, overcast or partly cloudy, cool temps
  const amWindDir = windDirName(amWeather.windDeg);
  const isStalkWind = ['N','NNE','NE','NNW'].includes(amWindDir) && amWeather.windSpeedMph >= 7 && amWeather.windSpeedMph <= 16;
  const isStalkTemp = amWeather.tempF >= 38 && amWeather.tempF <= 68;
  const isStalkHumid = amWeather.humidity >= 40 && amWeather.humidity <= 75; // not too wet/dry — quiet ground
  const isGoodStalkDay = isStalkWind && isStalkTemp && isStalkHumid && amWeather.windSpeedMph > 3;

  // PM summary
  if (pmResult.disqualified === 'wind') {
    pmSummary = `Afternoon wind jumps to ${Math.round(pmWeather.windSpeedMph)} mph. Rest the stand — not worth it.`;
  } else if (pmResult.score >= 72) {
    pmSummary = `Afternoon holds up too — ${pmTempStr}, ${pmWindStr}. ${isMoneyWind(pmWeather.windDeg) ? 'Wind stays in your favor. ' : ''}Come back for the evening sit or stay all day.${gunSeasonNote}`;
  } else if (pmWeather.tempF > 72 && isWarmHumidWind(pmWeather.windDeg)) {
    pmSummary = `Afternoon warms to ${pmTempStr} with a ${pmDir} wind pulling Gulf moisture. Deer are gonna be bedded — they won't move until after dark. Pull out by noon and rest the stand.${gunSeasonNote}`;
  } else if (pmWeather.tempF > 72) {
    pmSummary = `Afternoon heats up to ${pmTempStr}. ${pmDir} wind keeps the humidity down but it's still warm. Don't expect much until the last hour of light.${gunSeasonNote}`;
  } else {
    pmSummary = `Afternoon is ${pmTempStr} with ${pmWindStr}. Marginal — deer might move the last 45 minutes before dark if you want to sit it.${gunSeasonNote}`;
  }

  return { amSummary, pmSummary };
}

// Convert C to F
const cToF = c => c * 9/5 + 32;
// m/s to mph
const msToMph = ms => ms * 2.23694;

  if (stored) huntLog = JSON.parse(stored);

function saveLog() {
  try { localStorage.setItem('huntLog', JSON.stringify(huntLog)); } catch(e) {}

function daysSinceLastHunt() {
  if (!huntLog.length) return null;
  const last = huntLog[huntLog.length - 1];
  const diff = (Date.now() - new Date(last.date)) / (1000*60*60*24);
  return Math.floor(diff);
}

async function fetchForecast() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,precipitation,windspeed_10m,winddirection_10m,relativehumidity_2m,surface_pressure&daily=sunrise,sunset&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=7`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Weather fetch failed: ${resp.status}`);
  return resp.json();
}

function getHourlySlice(data, dayIdx, startHour, endHour) {
  const base = dayIdx * 24;
  const temps = [], winds = [], windDegs = [], humids = [], precips = [], pressures = [];
  for (let h = startHour; h < endHour; h++) {
    const i = base + h;
    if (i >= data.hourly.temperature_2m.length) break;
    temps.push(data.hourly.temperature_2m[i] || 0);
    winds.push(data.hourly.windspeed_10m[i] || 0);
    windDegs.push(data.hourly.winddirection_10m[i] || 0);
    humids.push(data.hourly.relativehumidity_2m[i] || 50);
    precips.push(data.hourly.precipitation[i] || 0); // already in inches
    pressures.push(data.hourly.surface_pressure[i] || 1013);
  }
  if (!temps.length) return { tempF: 65, windSpeedMph: 5, windDeg: 0, humidity: 50, precip: 0, pressures: [1013] };
  const avg = arr => arr.reduce((a,b) => a+b, 0) / arr.length;
  const maxWindIdx = winds.indexOf(Math.max(...winds));
  const dominantWind = windDegs[maxWindIdx] || 0;
  return {
    tempF: avg(temps),
    windSpeedMph: avg(winds),
    windDeg: dominantWind,
    humidity: avg(humids),
    precip: precips.reduce((a,b) => a+b, 0), // total inches for period
    pressures: pressures,
  };
}

// Get weather alert icon for a day
function getDayAlertIcon(data, dayIdx) {
  const base = dayIdx * 24;
  let maxPrecip = 0, minTemp = 999, maxWind = 0;
  const pressureStart = data.hourly.surface_pressure[base] || 1013;
  const pressureEnd = data.hourly.surface_pressure[Math.min(base + 23, data.hourly.surface_pressure.length - 1)] || 1013;
  const pressureDrop = (pressureStart - pressureEnd) * 0.02953; // inHg

  for (let h = 0; h < 24; h++) {
    const i = base + h;
    if (i >= data.hourly.temperature_2m.length) break;
    maxPrecip += (data.hourly.precipitation[i] || 0);
    minTemp = Math.min(minTemp, data.hourly.temperature_2m[i] || 999);
    maxWind = Math.max(maxWind, data.hourly.windspeed_10m[i] || 0);
  }

  // Priority order: snow > ice > thunderstorm > rain > front > wind
  if (minTemp <= 32 && maxPrecip > 0.1) return { icon: '❄', label: 'Snow/Ice', alert: true };
  if (maxPrecip > 0.5 && maxWind > 20) return { icon: '⛈', label: 'Storms', alert: true };
  if (maxPrecip > 0.3) return { icon: '🌧', label: 'Rain', alert: false };
  if (pressureDrop > 0.10) return { icon: '🌬', label: 'Front', alert: true };
  if (maxPrecip > 0.1) return { icon: '🌦', label: 'Showers', alert: false };
  return null;
}

      <div class="session-header">
        <div class="session-label">Evening Sit · 2pm–Dark</div>
        <div class="verdict ${pmClass}">${scoreVerdict(pmResult.score, false)}</div>
      </div>
      <div class="score-bar-wrap">
        <div class="score-bar-bg"><div class="score-bar-fill ${pmClass}" style="width:${pmResult.score}%"></div></div>
        <div class="score-pct">${pmResult.score}/100</div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-val ${pmWeather.tempF <= 65 ? 'good' : pmWeather.tempF <= 75 ? '' : 'warn'}">${Math.round(pmWeather.tempF)}°F</div>
          <div class="metric-lbl">Temp</div>
        </div>
        <div class="metric">
          <div class="metric-val ${pmWeather.windSpeedMph >= 4 && pmWeather.windSpeedMph <= 12 ? 'good' : pmWeather.windSpeedMph > 20 ? 'bad' : 'warn'}">${Math.round(pmWeather.windSpeedMph)} mph</div>
          <div class="metric-lbl">${windDirName(pmWeather.windDeg)} Wind</div>
        </div>
        <div class="metric">
          <div class="metric-val ${pmWeather.humidity < 65 ? 'good' : pmWeather.humidity < 80 ? '' : 'warn'}">${Math.round(pmWeather.humidity)}%</div>
          <div class="metric-lbl">Humidity</div>
        </div>
      </div>
      <div class="summary-box">${pmSummary}</div>
    </div>
  `;

  // To-do box
  if (todos.length > 0) {
    html += `
      <div class="session-card">
        <div class="todo-box">
          <div class="todo-label">While you're at it — ${phase.name}</div>
          ${todos.map(t => `<div class="todo-item">${t}</div>`).join('')}
        </div>
      </div>
    `;
  }

  // Vacuum effect banner
  const vacuumHours = buckKilledHoursAgo();
  if (vacuumHours !== null && vacuumHours <= 72) {
    const hoursLeft = Math.round(72 - vacuumHours);
    html += `<div class="pressure-alert" style="border-color:rgba(122,182,72,0.5);background:rgba(122,182,72,0.08);color:var(--green)">🦌 Buck down — vacuum effect active (~${hoursLeft}hrs left). Watch the timber edges and creek bottom. Bucks you've never seen may be cruising through to fill the void. Eyes open.</div>`;
  }

  // Season calendar cross-reference
  const calAlert = getUpcomingCalendarEvent();
  if (calAlert) {
    html += `<div class="pressure-alert" style="border-color:rgba(200,146,42,0.5);background:rgba(200,146,42,0.08);color:var(--amber)">📅 ${calAlert.icon} <strong>${calAlert.title}</strong> in ${calAlert.daysOut} day${calAlert.daysOut !== 1 ? 's' : ''} (${calAlert.dateStr}) — check the Season Calendar tab for what to do.</div>`;
  }

  // Hunt log
  html += `
    <div class="log-section">
      <div class="log-title">Stand Log${daysSince !== null ? ` · Last hunt: ${daysSince === 0 ? 'today' : daysSince + ' day' + (daysSince !== 1 ? 's' : '') + ' ago'}` : ''}</div>
      <div class="log-form">
        <select id="log-stand">
          <option>S Ladder</option>
          <option>N Ladder</option>
          <option>Box Blind</option>
          <option>Bryan Saddle</option>
          <option>Mason Pop-up</option>
        </select>
        <select id="log-session">
          <option>Morning</option>
          <option>Evening</option>
          <option>All Day</option>
        </select>
        <input id="log-note" placeholder="Notes (optional)" style="flex:1;min-width:120px">
      </div>
      <div class="log-form" style="align-items:center;gap:12px;padding:4px 0 8px">
        <label style="display:flex;align-items:center;gap:6px;font-family:monospace;font-size:0.78rem;color:var(--text);cursor:pointer">
          <input type="checkbox" id="log-harvest" onchange="toggleHarvestType()" style="width:16px;height:16px;accent-color:var(--green)">
          Deer killed
        </label>
        <div id="harvest-type-wrap" style="display:none;gap:8px;display:none">
          <label style="display:flex;align-items:center;gap:4px;font-family:monospace;font-size:0.78rem;color:var(--text);cursor:pointer">
            <input type="radio" name="harvest-type" value="buck" checked style="accent-color:var(--amber)"> Buck
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-family:monospace;font-size:0.78rem;color:var(--text);cursor:pointer">
            <input type="radio" name="harvest-type" value="doe" style="accent-color:var(--green)"> Doe
          </label>
        </div>
        <button onclick="logHunt()" style="margin-left:auto;background:var(--green-dim);color:var(--text-bright);border:1px solid var(--green-dim);font-family:monospace;font-size:0.78rem;padding:6px 14px;border-radius:4px;cursor:pointer">Log Hunt</button>
      </div>
      ${huntLog.slice(-5).reverse().map(e => `
        <div class="log-entry">
          <span>${e.date}</span> · ${e.stand} · ${e.session}${e.harvest ? ' · 🦌 ' + e.harvest + ' killed' : ''}${e.note ? ' · ' + e.note : ''}
        </div>
      `).join('')}
    </div>
  `;

  main.innerHTML = html;
}

function toggleHarvestType() {
  const checked = document.getElementById('log-harvest').checked;
  const wrap = document.getElementById('harvest-type-wrap');
  if (wrap) wrap.style.display = checked ? 'flex' : 'none';
}

function logHunt() {
  const stand = document.getElementById('log-stand').value;
  const session = document.getElementById('log-session').value;
  const note = document.getElementById('log-note').value;
  const harvested = document.getElementById('log-harvest') && document.getElementById('log-harvest').checked;
  const harvestType = harvested ? (document.querySelector('input[name="harvest-type"]:checked')?.value || 'buck') : null;
  const dateStr = new Date().toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
  huntLog.push({ date: dateStr, stand, session, note, harvest: harvestType, ts: Date.now() });
  if (huntLog.length > 30) huntLog = huntLog.slice(-30);
  saveLog();
  renderDay(selectedDay);
}

function buckKilledHoursAgo() {
  // Find most recent buck kill
  for (let i = huntLog.length - 1; i >= 0; i--) {
    if (huntLog[i].harvest === 'buck' && huntLog[i].ts) {
      const hours = (Date.now() - huntLog[i].ts) / (1000 * 60 * 60);
      if (hours <= 72) return hours;
    }
  }
  return null;
}

function getUpcomingCalendarEvent() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayN = (today.getMonth() + 1) * 100 + today.getDate();
  const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  for (const e of SEASON_EVENTS) {
    const year = e.month < 9 ? 2027 : 2026;
    const eDate = new Date(year, e.month - 1, e.day);
    eDate.setHours(0,0,0,0);
    const diffDays = Math.round((eDate - today) / (1000 * 60 * 60 * 24));
    if (diffDays > 0 && diffDays <= 7) {
      return { ...e, daysOut: diffDays, dateStr: `${monthNames[e.month]} ${e.day}` };
    }
  }
  return null;
}

// Swipe support — attached after DOM ready
function initSwipe() {
  const target = document.getElementById('forecast-tab');
  if (!target) return;
  let startX = 0, startY = 0, startTime = 0;

  target.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  target.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startTime;
    // Fast horizontal swipe: >40px, more horizontal than vertical, under 400ms
    if (dt < 400 && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0 && selectedDay < 6) {
        selectDay(selectedDay + 1);
      } else if (dx > 0 && selectedDay > 0) {
        selectDay(selectedDay - 1);
      }
    }
  }, { passive: true });
}

function renderWeekStrip(data) {
  const strip = document.getElementById('week-strip');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let html = '';
  const baseDate = new Date();
  baseDate.setHours(0,0,0,0);

  for (let i = 0; i < 7; i++) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + i);
    const amW = getHourlySlice(data, i, 5, 10);
    const pmW = getHourlySlice(data, i, 14, 19);
    const sol = getSolunarPeriods(d, LAT, LON);
    const amR = computeScore(amW, sol, d, true, i);
    const pmR = computeScore(pmW, sol, d, false, i);
    const best = Math.max(amR.score, pmR.score);
    const cls = scoreClass(best);
    const label = i === 0 ? 'Today' : i === 1 ? 'Tmrw' : days[d.getDay()];
    const alert = getDayAlertIcon(data, i);
    const alertHtml = alert ? `<div class="tab-alert ${alert.alert ? 'hot' : ''}">${alert.icon}</div>` : '';
    html += `
      <div class="day-tab ${i === selectedDay ? 'active' : ''} ${alert && alert.alert ? 'has-alert' : ''}" onclick="selectDay(${i})">
        <div class="dow">${label}</div>
        <div class="date-num">${d.getDate()}</div>
        <div class="tab-score ${cls}">${best}</div>
        ${alertHtml}
      </div>
    `;
  }
  strip.innerHTML = html;
}

function selectDay(i) {
  selectedDay = i;
  document.querySelectorAll('.day-tab').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
  renderDay(i);
}

async function init() {
  try {
    forecastData = await fetchForecast();
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('coords-label').textContent = `${STAND_LABEL} · Tomorrow: ${tomorrow.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`;
    renderWeekStrip(forecastData);
    renderDay(selectedDay); // defaults to tomorrow (index 1)
    initSwipe();
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="error-msg">Failed to load weather data. Check your connection and reload.<br><small>${e.message}</small></div>`;
    document.getElementById('week-strip').innerHTML = '';
  }
}

init();
</script>
